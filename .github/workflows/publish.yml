name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Restore
        run: dotnet restore NvAPIWrapper/NvAPIWrapper.csproj

      - name: Build
        run: dotnet build NvAPIWrapper/NvAPIWrapper.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack NvAPIWrapper/NvAPIWrapper.csproj -c Release -o ./nupkg --no-restore --no-build

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Error "NUGET_API_KEY secret is missing or empty. Add it under repo Settings > Secrets and variables > Actions."
            exit 1
          }
          dotnet nuget push "nupkg/Varun.NvAPIWrapper.Net.*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
        shell: pwsh
