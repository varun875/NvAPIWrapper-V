name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Restore
        run: dotnet restore NvAPIWrapper/NvAPIWrapper.csproj

      - name: Pack
        run: dotnet pack NvAPIWrapper/NvAPIWrapper.csproj -c Release -o Release --no-restore

      - name: Publish to NuGet (Trusted Publishing)
        run: dotnet nuget push "Release\Varun.NvAPIWrapper.Net.*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
